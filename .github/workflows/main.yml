name: CI Workflow for ML Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    # 1. Ambil kode dari repository
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Siapkan Python
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    # 3. Install Dependencies (Termasuk MLflow)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow pandas scikit-learn numpy matplotlib

    # 4. Jalankan MLflow Run
    # Kita masuk dulu ke folder 'SMSML_...' lalu masuk ke 'Membangun_model'
    # Karena file MLproject ada di dalam situ.
    - name: Run Model Training with MLflow
      run: |
        cd SMSML_Fathan-Rezah-Ardhiansa/Membangun_model
        mlflow run . --env-manager=local